# sondechase configuration. Lines are "key = value"; everything is optional.

# --- receiver ---
# freq_hz = 403500000      # decode at start-up; without it the app opens on the Radio screen, listening mid-band
sdr = auto                 # auto (whichever is on USB, RTL-SDR first), rtlsdr or hackrf
ppm = 0
# gain = 38.6              # RTL-SDR, dB; leave unset for tuner AGC
# hackrf_gain = 32,20,1    # HackRF: LNA,VGA,amp, or a total in dB (LNA, then VGA, then amp); unset = LNA 32 + VGA 24
rtl_dev = 0                # index among receivers of that kind
sdr_check = 1              # 1 = show the "No SDR device found" screen until an RTL-SDR or a HackRF is on USB
bias_tee = 0               # 1 = power an LNA through the RTL-SDR v4 bias-T (HackRF: antenna port power)

# --- scan ---
scan_lo_hz = 400000000
scan_hi_hz = 406000000
scan_step_hz = 5000

# --- position ---
gpsd_host = 127.0.0.1
gpsd_port = 2947
# ext_power_path = /sys/class/leds/ext_5v_out/brightness   # 5 V for a GPS cap on the EXT header: on while the app runs, put back on exit; empty = leave it
# gps_serial = /dev/ttyS0   # GPS cap read by the app while gpsd has no receiver; empty = off
cog_min_speed = 1.5        # m/s; above this the GPS course is the heading
mag_enable = 1             # IIO magnetometer, used when stationary or walking
# Calibration: set in the app (Info, K), saved to <data_dir>/compass.conf, which overrides these
mag_off_x = 0
mag_off_y = 0
mag_rot_deg = 0
mag_flip_y = 0
mag_off_z = 0
mag_tilt = 0               # 1 = tilt-compensated with the accelerometer
accel_axes = +x+y+z        # accelerometer axes as magnetometer axes (found by the calibration)
declination = 0

# --- prediction ---
# ground_alt = 10          # landing altitude AMSL; unset = this device's GPS altitude
burst_alt = 30000
descent_v0 = 6.0           # sea-level descent rate assumed before the burst, m/s

# --- proximity beeper ---
prox_radius_m = 10000
prox_hyst_m = 500
audio_enable = 1
# audio_cmd = pacat --raw --format=s16le --rate=16000 --channels=1 --latency-msec=120 --client-name=SondeChase 2>/dev/null
# Without PipeWire/PulseAudio, play straight to ALSA instead:
# audio_cmd = aplay -q -t raw -f S16_LE -r 16000 -c 1 --buffer-time=120000 - 2>/dev/null

# led_path = /sys/class/leds/ACT/brightness   # red LED blinked on each frame on the Track and Map screens; empty = none

# --- map ---
tile_online = 1            # download the tiles the Map screen is showing (Wi-Fi), keep them on disk
# tile_url = https://tile.openstreetmap.org/{z}/{x}/{y}.png
# tile_user_agent = SondeChase/<version> (CardputerZero app; github.com/hieuha)
# tile_cache_dir = /home/pi/sondechase/tiles
tile_cache_mb = 1000       # oldest downloaded tiles are removed above this size
tile_dir = /usr/share/sondechase/tiles   # optional preloaded pack (tools/prep_tiles.py), used before the cache
# map_lat = 21.0285         # Map centre before this device or a sonde has a position
# map_lon = 105.8542
map_simple = 1             # downloaded tiles: 1 = water and main roads only, 0 = detailed (V on the Map toggles)
zoom_min = 6
zoom_max = 18
font_dir = /usr/share/sondechase/fonts

# --- sondehub ---
# Upload decoded frames to sondehub.org, like radiosonde_auto_rx; off by default. Set them on Info 3/3 (U, C, E):
# the app keeps them in <data_dir>/sondehub.conf, read after this file. Sent: serial, frame, the sonde's time,
# position, speeds, sensors, the tuned frequency, your callsign. Upload needs network; a failed batch is dropped.
# callsign = N0CALL       # A-Z 0-9 -, up to 16; uploads stay off without one
# sondehub_upload = 0
# sondehub_chase = 0       # 1 = also share THIS DEVICE'S POSITION, shown on the map as <callsign>_chase
# sondehub_dev = 0         # 1 = the server checks the frames but does not store them (testing)
# sondehub_rate_s = 15     # seconds between telemetry batches, 10..300 (the chase car goes every 30 s)
# sondehub_url = https://api.v2.sondehub.org

# --- demo ---
# demo = 1                 # simulated flight: no SDR, GPS or decoder needed
# demo_speed = 30          # simulated seconds per real second

# --- misc ---
stale_s = 5
# data_dir = /home/pi/sondechase   # sondechase.csv, log/ (auto_rx format) and tiles/ (map cache) live here
# kbd_dev = /dev/input/event0
# fb_dev = /dev/fb1   # unset: the LCD is found at start (/dev/fb_lcd, else /proc/fb)
