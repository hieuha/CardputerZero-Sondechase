name: tests
on:
  push:
  pull_request:
jobs:
  core:
    # The core (no LVGL): parsers, geodesy, DSP, radio audio, tiles, and scan / listen / decode end to end
    # through the fake librtlsdr.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DSC_BUILD_UI=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
